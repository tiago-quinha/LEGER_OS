name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEGER_OS-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: LEGER_OS ${{ github.ref_name }}
          body: |
            ## 📱 LEGER_OS Android Native Build
            
            ### Installation:
            1. Download `app-debug.apk` below to your Android phone.
            2. Open the downloaded file and tap **Install** (allow installation from unknown sources if prompted).
            3. Launch **LEGER_OS** and grant the **Notification Listener** permission during onboarding.
            
            *Empirical Financial Intelligence & Zero-Credential Bank Ingestion.*
          draft: false
          prerelease: false
